<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LiveCheck</title>
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
    }
    .claim {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    .claim-header {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .verdict-true { background-color: #d4edda; }
    .verdict-false { background-color: #f8d7da; }
    .verdict-mixed { background-color: #fff3cd; }
    .verdict-unverified { background-color: #e2e3e5; }
    .timestamp {
      font-size: 12px;
      color: #666;
    }
    .no-claims {
      color: #666;
      text-align: center;
      padding: 20px;
      line-height: 1.5;
    }
    .status-processing {
      color: #0066cc;
    }
    .status-error {
      color: #dc3545;
    }
    .status-success {
      color: #28a745;
    }
    .cached-indicator {
      background-color: #e7f3ff;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #0066cc;
      margin-bottom: 12px;
      text-align: center;
    }
    .processing-header {
      background-color: #fff3cd;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: #856404;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>LiveCheck</h1>
  <div id="claims-container">
    <div class="no-claims">Loading...</div>
  </div>
  <script src="src/popup.js"></script>
</body>
</html>
